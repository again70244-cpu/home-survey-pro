name: Supabase keep-alive

# Supabase 免費方案約 7 天沒有活動會自動暫停專案。
# 這裡每週兩次送出一個「唯讀」查詢讓專案保持啟用（不寫入、不修改任何資料）。
# 只使用公開的 anon key（已在部署用的 Variables 中），不使用任何高權限金鑰。
on:
  schedule:
    - cron: '17 3 * * 1,4' # 每週一、四 03:17 UTC（台灣 11:17）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only query
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "缺少 VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY"; exit 1; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 --retry 3 --retry-delay 20 \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/catalog_products?select=id&limit=1")
          echo "HTTP $code"
          # 2xx/4xx 都代表資料庫有回應；5xx 或連線失敗才算失敗（例如專案已被暫停）
          if [ "$code" -ge 500 ] || [ "$code" = "000" ]; then exit 1; fi
